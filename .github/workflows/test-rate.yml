name: Publish dirham rate

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: publish-dirham-rate
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install parser
        run: python3 -m pip install beautifulsoup4

      - name: Read rate and publish only when it changes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from contextlib import redirect_stdout
          from io import StringIO
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          from read_rate import read_rate

          state = Path(".last-dhs-post")
          output = StringIO()
          with redirect_stdout(output):
              rate = read_rate()

          prefix = "Source post: https://t.me/DHS_Dirham/"
          post_id = next(
              (
                  line[len(prefix):].strip()
                  for line in output.getvalue().splitlines()
                  if line.startswith(prefix)
              ),
              "",
          )
          if not post_id.isascii() or not post_id.isdecimal():
              raise SystemExit("Could not identify the source post.")

          final_rate = rate + 500
          message = f"نرخ این لحظه‌ی ما برای هر درهم: {final_rate:,} تومان"

          saved = state.read_text(encoding="utf-8").split() if state.exists() else []
          if saved and int(post_id) <= int(saved[0]):
              print("No new source post.")
              raise SystemExit(0)

          new_state = f"{post_id}\n{final_rate}\n"
          if len(saved) > 1 and final_rate == int(saved[1]):
              state.write_text(new_state, encoding="utf-8")
              print("Rate unchanged.")
              raise SystemExit(0)

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          if not token:
              raise SystemExit("TELEGRAM_BOT_TOKEN is missing in Eagleaed-rate.")

          request = Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=json.dumps({"chat_id": "@eagleaed", "text": message}).encode("utf-8"),
              headers={"Content-Type": "application/json"},
          )
          try:
              with urlopen(request, timeout=20) as response:
                  result = json.load(response)
          except HTTPError as error:
              raise SystemExit(f"Telegram returned HTTP {error.code}.") from None
          except URLError:
              raise SystemExit("Could not reach Telegram.") from None

          if not result.get("ok"):
              raise SystemExit("Telegram did not confirm the message.")

          state.write_text(new_state, encoding="utf-8")
          print(f"Published source post {post_id}: {message}")
          PY

      - name: Save last checked post and rate
        run: |
          if [ -z "$(git status --porcelain -- .last-dhs-post)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .last-dhs-post
          git commit -m "Save last checked DHS post and rate"
          git push
